#cloud-config
# Paste into Hetzner "Create server" -> "Cloud config" field.
# NEVER paste the Cloudflare Tunnel token into this file: Hetzner user data stays readable at
# 169.254.169.254 for the server's lifetime and cannot be changed (22 Oct 2026: token found there, rotated).
# After first boot: ssh in, then  cd /opt/waypoint && read -rsp 'Token: ' T && sed -i "s|^CLOUDFLARE_TUNNEL_TOKEN=.*|CLOUDFLARE_TUNNEL_TOKEN=$T|" .env && unset T && docker compose up -d
package_update: true
package_upgrade: true
packages:
  - ufw
  - curl
  - openssl

write_files:
  - path: /etc/systemd/system/block-metadata.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Block Hetzner metadata (169.254.169.254) from Docker containers
      After=docker.service
      Requires=docker.service
      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'iptables -C DOCKER-USER -d 169.254.169.254 -j DROP 2>/dev/null || iptables -I DOCKER-USER -d 169.254.169.254 -j DROP'
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target
  - path: /opt/waypoint/docker-compose.yml
    permissions: "0644"
    content: |
      services:
        postgres:
          image: postgres:16.15
          restart: unless-stopped
          environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
          volumes:
            - postgres_data:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 10
        n8n:
          image: docker.n8n.io/n8nio/n8n:2.43.5
          restart: unless-stopped
          depends_on:
            postgres:
              condition: service_healthy
          environment:
            DB_TYPE: postgresdb
            DB_POSTGRESDB_HOST: postgres
            DB_POSTGRESDB_PORT: 5432
            DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
            DB_POSTGRESDB_USER: ${POSTGRES_USER}
            DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
            N8N_HOST: ${N8N_HOST}
            N8N_PROTOCOL: https
            N8N_PORT: 5678
            WEBHOOK_URL: https://${N8N_HOST}/
            N8N_PROXY_HOPS: 1
            N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
            N8N_RUNNERS_ENABLED: "true"
            N8N_DIAGNOSTICS_ENABLED: "false"
            N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
            GENERIC_TIMEZONE: Europe/Berlin
            TZ: Europe/Berlin
            EXECUTIONS_DATA_PRUNE: "true"
            EXECUTIONS_DATA_MAX_AGE: 336
          volumes:
            - n8n_data:/home/node/.n8n
        cloudflared:
          image: cloudflare/cloudflared:2026.10.2
          restart: unless-stopped
          command: tunnel --no-autoupdate run
          environment:
            TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
          depends_on:
            - n8n
      volumes:
        postgres_data:
        n8n_data:

runcmd:
  - ufw allow OpenSSH
  - ufw --force enable
  - curl -fsSL https://get.docker.com | sh
  - systemctl daemon-reload && systemctl enable --now block-metadata.service
  - |
    cd /opt/waypoint
    cat > .env <<ENV
    N8N_HOST=n8n.noahhofmann.com
    POSTGRES_USER=n8n
    POSTGRES_PASSWORD=$(openssl rand -hex 32)
    POSTGRES_DB=n8n
    N8N_ENCRYPTION_KEY=$(openssl rand -hex 32)
    CLOUDFLARE_TUNNEL_TOKEN=
    ENV
    sed -i 's/^ *//' .env
    chmod 600 .env
    docker compose up -d
