#cloud-config
# Paste into Hetzner "Create server" -> "Cloud config" field.
# Replace PASTE_TUNNEL_TOKEN_HERE with your Cloudflare Tunnel token first.
package_update: true
package_upgrade: true
packages:
  - ufw
  - curl
  - openssl

write_files:
  - path: /opt/waypoint/docker-compose.yml
    permissions: "0644"
    content: |
      services:
        postgres:
          image: postgres:16
          restart: unless-stopped
          environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
          volumes:
            - postgres_data:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 10
        n8n:
          image: docker.n8n.io/n8nio/n8n:stable
          restart: unless-stopped
          depends_on:
            postgres:
              condition: service_healthy
          environment:
            DB_TYPE: postgresdb
            DB_POSTGRESDB_HOST: postgres
            DB_POSTGRESDB_PORT: 5432
            DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
            DB_POSTGRESDB_USER: ${POSTGRES_USER}
            DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
            N8N_HOST: ${N8N_HOST}
            N8N_PROTOCOL: https
            N8N_PORT: 5678
            WEBHOOK_URL: https://${N8N_HOST}/
            N8N_PROXY_HOPS: 1
            N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
            N8N_RUNNERS_ENABLED: "true"
            N8N_DIAGNOSTICS_ENABLED: "false"
            N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
            GENERIC_TIMEZONE: Europe/Berlin
            TZ: Europe/Berlin
            EXECUTIONS_DATA_PRUNE: "true"
            EXECUTIONS_DATA_MAX_AGE: 336
          volumes:
            - n8n_data:/home/node/.n8n
        cloudflared:
          image: cloudflare/cloudflared:latest
          restart: unless-stopped
          command: tunnel --no-autoupdate run
          environment:
            TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
          depends_on:
            - n8n
      volumes:
        postgres_data:
        n8n_data:

runcmd:
  - ufw allow OpenSSH
  - ufw --force enable
  - curl -fsSL https://get.docker.com | sh
  - |
    cd /opt/waypoint
    cat > .env <<ENV
    N8N_HOST=n8n.noahhofmann.com
    POSTGRES_USER=n8n
    POSTGRES_PASSWORD=$(openssl rand -hex 32)
    POSTGRES_DB=n8n
    N8N_ENCRYPTION_KEY=$(openssl rand -hex 32)
    CLOUDFLARE_TUNNEL_TOKEN=PASTE_TUNNEL_TOKEN_HERE
    ENV
    sed -i 's/^ *//' .env
    chmod 600 .env
    docker compose up -d
